[workspace]
members = ["crates/mtg-core", "crates/mtg-fixture", "crates/mtg-recorder", "crates/mtg-cli", "crates/mtg-policy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

# Keep checked/debug test behavior while avoiding interpreter-like overhead in
# full-game snapshot, JSON and replay integration tests. Release is tested too.
[profile.test]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
