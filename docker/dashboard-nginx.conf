worker_processes 1;
pid /tmp/mtg-dashboard-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/mtg-nginx-client;
    proxy_temp_path /tmp/mtg-nginx-proxy;
    fastcgi_temp_path /tmp/mtg-nginx-fastcgi;
    uwsgi_temp_path /tmp/mtg-nginx-uwsgi;
    scgi_temp_path /tmp/mtg-nginx-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 4317;
        server_name localhost;
        location = /operator-summary.js {
            alias /opt/mtg-lab/scripts/symphony/dashboard/summary.js;
            default_type application/javascript;
            add_header Cache-Control no-store;
        }
        location = /operator-summary.css {
            alias /opt/mtg-lab/scripts/symphony/dashboard/summary.css;
            default_type text/css;
            add_header Cache-Control no-store;
        }
        location = /operator-summary.json {
            proxy_pass http://127.0.0.1:4319;
            proxy_read_timeout 8s;
        }
        location = / {
            proxy_pass http://127.0.0.1:4318;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<link rel="stylesheet" href="/operator-summary.css"><script defer src="/operator-summary.js"></script></head>';
            sub_filter_once on;
            add_header Cache-Control no-store;
        }
        location / {
            proxy_pass http://127.0.0.1:4318;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
