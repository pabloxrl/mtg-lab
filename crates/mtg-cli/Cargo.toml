[package]
name = "mtg-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mtg"
path = "src/main.rs"

[dependencies]
mtg-policy = { path = "../mtg-policy" }
mtg-core = { path = "../mtg-core" }
mtg-recorder = { path = "../mtg-recorder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
