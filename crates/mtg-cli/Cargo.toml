[package]
name = "mtg-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mtg"
path = "src/main.rs"

[dependencies]
mtg-core = { path = "../mtg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"

[build-dependencies]
sha2 = "0.10"
