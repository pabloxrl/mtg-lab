name: Problem for agents
description: Describe an outcome; add agent-ready when you want work to begin.
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: What should work, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results that demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and references
      description: Relevant RFC sections, scope limits, examples, or dependencies.
